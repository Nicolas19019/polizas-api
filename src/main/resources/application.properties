spring.application.name=polizas-api
server.port=${PUERTO:8080}
spring.datasource.url=jdbc:h2:mem:polizas;DB_CLOSE_DELAY=-1
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.open-in-view=false
spring.h2.console.enabled=false
aplicacion.clave-api=${CLAVE_API:123456}
core.url-base=${URL_CORE:http://localhost:${server.port}}
springdoc.swagger-ui.tags-sorter=alpha
springdoc.swagger-ui.operations-sorter=method
springdoc.swagger-ui.persist-authorization=true
springdoc.swagger-ui.default-models-expand-depth=-1
